            background-color: rgba(0, 0, 0, 0.6);

            top: 0;

            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        }

            color: #ff9a8b;
            text-decoration: none;

        .wrapper {

        .title {

            margin-bottom: 20px;
        }

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        .card {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            width: 250px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .content {
            padding: 15px;
            text-align: center;
        }

        .contentBx h3 {

        .sci {

            padding: 0;

        }

        .sci li {

            background-color: rgba(0, 0, 0, 0.6);
            color: #888;
            font-size: 0.9rem;
            margin-top: auto;
            backdrop-filter: blur(10px);
            box-shadow: 0px -4px 6px rgba(0, 0, 0, 0.3);

        footer a {
